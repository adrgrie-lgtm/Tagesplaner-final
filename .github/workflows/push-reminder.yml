name: Termin-Erinnerung pushen

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    paths: ['docs/push-setup-trigger.txt']

concurrency:
  group: push-reminder

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web-push installieren
        run: npm install web-push
      - name: Erinnerung senden
        run: node .github/scripts/send-reminder.mjs
