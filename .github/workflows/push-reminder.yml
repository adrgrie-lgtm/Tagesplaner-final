name: Termin-Erinnerung pushen

on:
  schedule:
    - cron: '0 6 * * *'    # morgens 07:00 Berlin (Winter) / 08:00 (Sommer)
    - cron: '15 6 * * *'   # morgens Retry (+15 min, Dedup verhindert Doppel)
    - cron: '0 7 * * *'    # morgens Retry (+60 min)
    - cron: '30 17 * * *'  # abends 18:30 Berlin (Winter) / 19:30 (Sommer)
    - cron: '45 17 * * *'  # abends Retry (+15 min)
    - cron: '0 18 * * *'   # abends Retry (+30 min)
  workflow_dispatch:
    inputs:
      modus:
        description: 'Welche Erinnerung: heute oder morgen'
        required: false
        default: 'morgen'
  push:
    branches: [main]

concurrency:
  group: push-reminder-v4

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: web-push installieren
        run: npm install web-push@3.6.7
      - name: Erinnerung senden
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '0 6 * * *'|'15 6 * * *'|'0 7 * * *') MODUS=heute;;
              *) MODUS=morgen;;
            esac
          else
            MODUS="${{ github.event.inputs.modus }}"
            if [ -z "$MODUS" ]; then
              H=$(date -u +%H)
              if [ "$H" -lt 12 ]; then MODUS=heute; else MODUS=morgen; fi
            fi
          fi
          echo "Sende Erinnerung (Modus: $MODUS)"
          node .github/scripts/send-reminder.mjs "$MODUS" 2>&1 | tee remind.log
      - name: Fehler in Issue posten
        if: failure()
        run: |
          BODY=$(jq -Rs . remind.log)
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Erinnerungs-Workflow fehlgeschlagen\",\"body\":$BODY}"