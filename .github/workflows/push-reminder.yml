name: Termin-Erinnerung pushen

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
  push:
    paths: ['docs/push-setup-trigger.txt']

concurrency:
  group: push-reminder

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: VAPID-Schluessel erzeugen (einmalig)
        run: |
          if [ ! -f docs/vapid-public.key ]; then
            npm install -g web-push > /dev/null 2>&1
            KEYS=$(web-push generate-vapid-keys --json)
            echo "$KEYS" | jq -r '.publicKey'  > docs/vapid-public.key
            echo "$KEYS" | jq -r '.privateKey' > docs/vapid-private.key
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/vapid-public.key docs/vapid-private.key
            git commit -m "VAPID-Schluessel fuer Push-Erinnerung erzeugt"
            git push
          else
            echo "VAPID-Schluessel bereits vorhanden"
          fi
      - name: web-push installieren
        run: npm install web-push > /dev/null 2>&1
      - name: Erinnerung senden
        run: node .github/scripts/send-reminder.mjs
