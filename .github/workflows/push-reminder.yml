name: Termin-Erinnerung pushen

on:
  schedule:
    # Stuendlich laufen lassen - send-reminder.mjs entscheidet SELBST,
    # ob der Zeitpunkt im Zeitfenster liegt (Berlin 5-13 Uhr: "heute",
    # 17-23 Uhr: "morgen") und dedupliziert pro Tag (Firestore-Marker).
    # Grund: GitHub verspaetet geplante Workflow-Laeufe regelmaessig um
    # mehrere Stunden; feste Einzel-Crons um 06:00/17:30 UTC kamen real
    # erst nachmittags bzw. nach Mitternacht an.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Welche Erinnerung: heute oder morgen (leer = automatisch nach Berliner Uhrzeit, evtl. gar nicht senden)'
        required: false
        default: ''
  push:
    branches: [main]

concurrency:
  group: push-reminder-v5

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: web-push installieren
        run: npm install web-push@3.6.7
      - name: Erinnerung senden
        run: |
          set -o pipefail
          MODUS="${{ github.event.inputs.modus }}"
          if [ -n "$MODUS" ]; then
            echo "Sende Erinnerung (Modus: $MODUS)"
            node .github/scripts/send-reminder.mjs "$MODUS" 2>&1 | tee remind.log
          else
            node .github/scripts/send-reminder.mjs 2>&1 | tee remind.log
          fi
      - name: Fehler in Issue posten
        if: failure()
        run: |
          BODY=$(jq -Rs . remind.log)
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d "{\"title\":\"Erinnerungs-Workflow fehlgeschlagen\",\"body\":$BODY}"
